name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Xcode ${{ matrix.xcode }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            xcode: '26.6'
          - runner: xcode-27
            xcode: '27.2'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Select required Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

      - name: Versions
        run: swift --version && xcodebuild -version

      - name: Build (debug)
        run: swift build

      - name: Build (release)
        run: swift build -c release

      - name: Unit tests
        run: swift test

      - name: Client and MCP protocol regressions (no simulator)
        run: |
          bash examples/dtuhid-contract.sh
          bash examples/gesture-contract.sh
          bash examples/display-contract.sh
          python3 examples/transport-smoke.py .build/release/wand
          python3 examples/protocol-regressions.py .build/release/wand
          python3 examples/lifecycle-regressions.py .build/release/wand
          python3 examples/native/ci-test.py

      - name: Smoke — help + layout
        run: |
          ./.build/release/wand help
          ./.build/release/wand layout

      - name: Required live input outcomes (owned throwaway)
        run: python3 examples/native/ci.py

      - name: Preserve live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-input-evidence-xcode-${{ matrix.xcode }}
          path: live-evidence/
          retention-days: 7
